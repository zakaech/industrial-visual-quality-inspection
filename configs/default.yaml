# =============================================================================
# Configuration de référence — v1 : accepter/rejeter binaire sur KolektorSDD2
# -----------------------------------------------------------------------------
# Tous les hyperparamètres du pipeline vivent ici ; le code ne doit jamais coder
# en dur l'une de ces valeurs. Le schéma typé est dans src/vqi/config.py : toute
# clé inconnue, manquante ou mal typée fait échouer le chargement.
# Les valeurs marquées TBD sont des emplacements à remplir depuis une exécution
# réelle ou depuis l'EDA (Phase 1) — jamais devinées.
# Les surcharges propres à une expérience vont dans configs/experiments/<name>.yaml
# et sont fusionnées par-dessus ce fichier.
# Les clés restent en anglais (convention de nommage du code).
# =============================================================================

project:
  name: industrial-visual-quality-inspection
  version: "0.1.0"
  task: binary_classification          # classe positive = défectueux (celle qu'il est coûteux de manquer)
  positive_class_name: defective
  negative_class_name: good

reproducibility:
  seed: 42                             # seede random, numpy, torch et chaque worker de DataLoader
  deterministic: true                  # torch.use_deterministic_algorithms(True, warn_only=True)
  torch_num_threads: 4                 # cœurs physiques du CPU cible (i7-8665U)

paths:
  data_root: data
  raw_dir: data/raw
  interim_dir: data/interim            # manifest.csv, rapport de doublons
  processed_dir: data/processed        # réservé (tenseurs mis en cache) — inutilisé en v1
  splits_dir: data/splits              # manifestes CSV versionnés : image_id, label, split, sha256, phash
  runs_dir: runs                       # un sous-dossier par run : checkpoints, métriques, config figée
  logs_dir: logs
  reports_dir: reports                 # rapports EDA / évaluation (figures + markdown)

dataset:
  name: kolektor_sdd2
  source_url: "https://data.vicos.si/datasets/KSDD/KolektorSDD2.zip"   # cible du lien officiel go.vicos.si/kolektorsdd2
  archive_name: KolektorSDD2.zip
  archive_sha256: "edcdb486809b24f1d17b785e30c52fafc5999554dd5fe18ddf77b61ceb6f36a8"  # mesuré le 15/09/2026 (853 126 555 octets)
  raw_subdir: kolektor_sdd2            # extraction dans data/raw/kolektor_sdd2/{train,test}
  train_subdir: train
  test_subdir: test
  image_ext: ".png"
  mask_suffix: "_GT"                   # convention KSDD2 : <id>.png / <id>_GT.png
  image_id_pattern: "^[0-9]+$"         # tout fichier hors convention (ex. "10301 (copy).png") est
                                       # inventorié, marqué name_conforms=false et exclu — jamais supprimé
  label_rule: mask_non_empty           # défectueux <=> le masque de vérité terrain a >= 1 pixel positif
  use_official_split: true             # la partition train/test des auteurs est conservée telle quelle
  expected_counts:                     # d'après Božič et al. (2021) et la page officielle ViCoS ;
    train_total: 2331                  # make_splits refuse de tourner si le manifeste diffère
    train_defective: 246
    test_total: 1004
    test_defective: 110

split:
  strategy: stratified_group_holdout   # hold-out unique 80/20, stratifié sur le label, respectant les groupes (D3)
  val_fraction: 0.20                   # prélevée dans le train officiel UNIQUEMENT (jamais dans le test)
  stratify_on: label
  group_column: null                   # à renseigner avec un id de pièce/session s'il devient disponible (L1, L2) ;
                                       # sinon le group_id vient de la détection de doublons
  duplicates:
    exact_hash: sha256                 # doublons pixel-identiques : on en garde un, on journalise les autres (L4)
    near_duplicate_method: phash       # hachage perceptuel (L1) : DCT 32x32 -> 8x8 = 64 bits
    phash_size: 8
    phash_highfreq_factor: 4
    max_hamming_distance: null         # TBD après l'EDA (distribution des distances au plus proche voisin) ;
                                       # null = aucun quasi-doublon n'est groupé/exclu automatiquement
    candidate_thresholds: [0, 2, 4, 6, 8, 10, 12]   # table de sensibilité produite par l'EDA
    policy: same_split                 # quand un seuil est fixé : les quasi-doublons vont dans le même split
  test_policy: single_final_evaluation # le script de test exige un threshold.json issu de la validation
  manifest_version: v1                 # nom du fichier data/splits/<manifest_version>.csv

preprocessing:                         # UN SEUL module (src/vqi/preprocessing) pour l'entraînement ET l'API (R4)
  color_mode: rgb                      # validé Phase 1 : images quasi monochromes, mais l'écart entre canaux porte du signal
  input_size:                          # H x W ; natif médian 637 x 229 -> échelle 0,978, 17 lignes de padding (Phase 2 §A.1)
    height: 640
    width: 224
  resize_mode: keep_aspect_pad         # keep_aspect_pad | stretch  (stretch rejeté : efface les petits défauts, D7)
  pad_value: median                    # median | zero — médiane de l'image évite un bord artificiel ; ablation en Phase 2
  interpolation: area                  # cv2.INTER_AREA (réduction)
  normalization:                       # statistiques ImageNet, exigées par le backbone pré-entraîné (L5)
    mean: [0.485, 0.456, 0.406]
    std: [0.229, 0.224, 0.225]
  enhancement:                         # opérateurs OpenCV appliqués après la géométrie, sur la luminance (LAB) ou RGB
    active: none                       # variante utilisée par l'entraînement (Phase 3) et l'API ; décidée en Phase 2
    variants:                          # chaque variante = liste ordonnée d'opérateurs ; testées SÉPARÉMENT (Phase 2 §A)
      none: []
      equalize:
        - {op: equalize_hist}
      clahe:
        - {op: clahe, clip_limit: 2.0, tile_grid_size: [8, 8]}
      denoise_light:
        - {op: gaussian_blur, ksize: 3, sigma: 0.8}
      denoise_strong:
        - {op: median_blur, ksize: 5}
      unsharp:
        - {op: unsharp_mask, sigma: 1.5, amount: 1.0}
      laplacian:                       # comparaison visuelle / CNR uniquement, hors matrice sauf si le CNR le justifie
        - {op: laplacian_sharpen, strength: 0.5}

augmentation:                          # appliquée au split train UNIQUEMENT ; toutes préservent le label (R10)
  horizontal_flip_p: 0.5
  vertical_flip_p: 0.5
  rotate_90_p: 0.0                     # TBD après l'EDA : seulement si les défauts sont invariants à l'orientation
  brightness_contrast:
    enabled: true
    brightness_limit: 0.10
    contrast_limit: 0.10
    p: 0.30
  random_crop:
    enabled: false                     # rejeté en v1 : un recadrage peut retirer le défaut et inverser le label

model:
  architecture: resnet18               # resnet18 | resnet34 | efficientnet_b0 | mobilenet_v3_large
  pretrained: true                     # poids ImageNet (torchvision)
  num_outputs: 1                       # un seul logit -> sigmoïde -> P(défectueux)
  dropout: 0.2
  freeze_backbone: false               # true = référence « sonde linéaire » (contrôle CPU bon marché)
  freeze_bn_stats: false

training:
  device: cpu                          # aucun périphérique CUDA sur la machine cible
  num_workers: 4
  epochs: 20
  batch_size: 16
  optimizer:
    name: adamw
    lr: 1.0e-4
    weight_decay: 1.0e-4
  scheduler:
    name: cosine                       # cosine | none
    warmup_epochs: 1
  loss:
    name: bce_with_logits              # bce_with_logits | focal
    pos_weight: 1.0                    # D4 : BCE simple pour la calibration ; ablation prévue sur [1, 3, 9]
    focal_gamma: 2.0                   # utilisé seulement si loss.name == focal
  sampler: none                        # none | weighted_random (alternative à pos_weight)
  early_stopping:
    monitor: val_average_precision     # indépendante du seuil, robuste au déséquilibre (§4.2)
    mode: max
    patience: 5
  checkpoint:
    save_best_only: true
    monitor: val_average_precision
  grad_clip_norm: 5.0
  log_every_n_steps: 20
  dry_run_epochs: 1                    # run de chronométrage avant de s'engager sur le planning (R5)

evaluation:
  positive_label: 1
  threshold_policy:
    name: min_recall                   # min_recall | expected_cost | max_f_beta
    target_recall: 0.95                # D5 / R1 : 0,99 n'est pas estimable avec ~49 positifs en validation
    cost_fn: 10.0                      # expected_cost : coût d'un défaut manqué (unités relatives) — donnée métier, TBD
    cost_fp: 1.0                       # expected_cost : coût d'un rejet à tort (réinspection)
    f_beta: 2.0                        # max_f_beta : comparaison uniquement
  report_recall_targets: [0.90, 0.95, 0.98, 0.99]
  bootstrap:
    n_resamples: 1000
    confidence_level: 0.95
  calibration:
    n_bins: 10
    temperature_scaling: false         # activé seulement si l'ECE de validation est élevé (R7) — TBD
  defect_size_analysis: true           # rappel vs aire du défaut en pixels, depuis les masques (évaluation seule, L7)
  gradcam:
    enabled: true
    target_layer: layer4
    n_examples: 16

eda:                                   # analyse exploratoire (Phase 1) — sorties dans reports/eda/
  report_subdir: eda
  contact_sheet:
    n_per_class: 8                     # exemples par classe sur la planche de contact
    thumb_height: 320
  defect_area_bins: [0, 50, 100, 250, 500, 1000, 2500, 5000, 10000, 1000000]   # pixels, pour l'histogramme
  n_closest_pairs: 12                  # paires pHash les plus proches montrées côte à côte

baseline:                              # Phase 2 : descripteurs classiques + scikit-learn, sorties dans reports/phase2/
  report_subdir: phase2
  features_cache_dir: data/processed/features   # une matrice .npz par (variante, padding), invalidée par hash
  allowed_splits: [train, val]         # le test officiel est interdit ici (le chargeur lève une exception)
  histogram_bins: 32                   # histogramme gris normalisé
  lbp:                                 # LBP uniforme invariant en rotation (P + 2 bins par échelle)
    - {points: 8, radius: 1}
    - {points: 16, radius: 2}
  local_stats:
    patch_size: 32                     # grille de patches : les défauts sont locaux (aire médiane 1,6 % de l'image)
  feature_groups:                      # nom -> extracteurs concaténés
    contrast_only: [contrast_only]     # référence triviale (Phase 1 : AUC 0,72 sur le train officiel)
    global_stats: [global_stats, histogram]
    lbp: [lbp]
    local_stats: [local_stats]
    combined: [global_stats, histogram, lbp, local_stats]
  svm:
    kernel: rbf
    c_grid: [0.1, 1.0, 10.0, 100.0]
    gamma_grid: [scale, 0.001, 0.01, 0.1]
    cv_folds: 5                        # validation croisée stratifiée par groupe, À L'INTÉRIEUR DU TRAIN uniquement
    cv_scoring: average_precision
  class_weights:                       # options comparées en E2 ; "manual" est EXPLORATOIRE, pas un coût métier
    none: null
    balanced: balanced
    manual: {1: 3.0}                   # ≈ racine du ratio de déséquilibre (8,5)
  random_forest:
    n_estimators: 500
    max_features: sqrt
    class_weight: balanced
  representative_images:               # figures de comparaison : images du split TRAIN uniquement
    n_healthy: 2
    small_defect_max_area: 100
  cnr:                                 # contraste-sur-bruit du défaut, depuis les masques (analyse, jamais entraînement)
    ring_width: 6
    area_bins: [0, 100, 250, 1000, 2500, 5000, 1000000]
    variants: [none, equalize, clahe, denoise_light, denoise_strong, unsharp, laplacian]
  experiments:                         # fit sur train, mesure sur validation ; hyperparamètres par CV interne au train
    - {id: E0_contrast_only, features: contrast_only, preprocessing: none, classifier: none, class_weight: none}
    - {id: E1_global_stats, features: global_stats, preprocessing: none, classifier: svm, class_weight: balanced}
    - {id: E1_lbp, features: lbp, preprocessing: none, classifier: svm, class_weight: balanced}
    - {id: E1_local_stats, features: local_stats, preprocessing: none, classifier: svm, class_weight: balanced}
    - {id: E1_combined, features: combined, preprocessing: none, classifier: svm, class_weight: balanced}
    - {id: E2_cw_none, features: combined, preprocessing: none, classifier: svm, class_weight: none}
    - {id: E2_cw_manual, features: combined, preprocessing: none, classifier: svm, class_weight: manual}
    - {id: E3_equalize, features: combined, preprocessing: equalize, classifier: svm, class_weight: balanced}
    - {id: E3_clahe, features: combined, preprocessing: clahe, classifier: svm, class_weight: balanced}
    - {id: E3_denoise_light, features: combined, preprocessing: denoise_light, classifier: svm, class_weight: balanced}
    - {id: E3_denoise_strong, features: combined, preprocessing: denoise_strong, classifier: svm, class_weight: balanced}
    - {id: E3_unsharp, features: combined, preprocessing: unsharp, classifier: svm, class_weight: balanced}
    - {id: E3_pad_zero, features: combined, preprocessing: none, classifier: svm, class_weight: balanced, pad_value: zero}
    - {id: E4_random_forest, features: combined, preprocessing: none, classifier: rf, class_weight: balanced}
    # contrôle de bord de grille : gamma = 0,001 (borne basse) sélectionné dans toutes les expériences SVM
    - {id: E5_grid_edge_check, features: combined, preprocessing: none, classifier: svm, class_weight: balanced,
       c_grid: [10.0, 100.0, 1000.0], gamma_grid: [0.0001, 0.0003, 0.001]}
    # RBF à gamma -> 0 et C grand tend vers un séparateur linéaire : contrôle avec un noyau linéaire
    - {id: E5_linear_svm, features: combined, preprocessing: none, classifier: svm, class_weight: balanced,
       kernel: linear, c_grid: [0.001, 0.01, 0.1, 1.0, 10.0]}

inference:
  export_format: torchscript           # torchscript | state_dict
  bundle_dir: runs/best                # model.pt, threshold.json, preprocessing.json, version.json
  batch_size: 1

api:
  host: 0.0.0.0
  port: 8000
  model_version: "TBD"                 # fixé à l'export : <hash git court>-<run id>
  max_upload_mb: 10
  allowed_content_types: ["image/png", "image/jpeg", "image/bmp"]
  decision_labels:
    positive: REJECT
    negative: ACCEPT

logging:
  level: INFO
  format: json                         # json | text — un objet JSON par ligne (journalisation structurée)
  file: logs/vqi.log                   # null = console uniquement
