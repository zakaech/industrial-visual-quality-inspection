[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "vqi"
version = "0.1.0"
description = "Industrial visual quality inspection: surface-defect detection pipeline, from raw data to a containerised inference API."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Zakaria" }]
dependencies = [
    # Inference API runtime (what the Docker image installs, pinned in requirements-api.txt).
    # Exact versions of everything are locked in requirements.txt (generated from a real install).
    "torch>=2.2",
    "torchvision>=0.17",
    "opencv-python-headless>=4.9",
    "numpy>=1.26",
    "pyyaml>=6.0",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "python-multipart>=0.0.9",
]

[project.optional-dependencies]
train = [
    # data pipeline, baselines, training, evaluation and reports (not needed to serve the model)
    "scikit-learn>=1.4",
    "pandas>=2.2",
    "matplotlib>=3.8",
]
dev = [
    "pytest>=8.0",
    "ruff>=0.4",
    "httpx>=0.27",  # fastapi.testclient (API tests only)
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "scripts", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "N", "W"]
